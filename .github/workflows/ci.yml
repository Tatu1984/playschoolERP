name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Everything that needs no database. Fast, and the common case.
  check:
    name: Lint, types, unit tests
    runs-on: ubuntu-latest
    # No database is contacted in this job, but `npm ci` runs `prisma generate`
    # through postinstall, and prisma.config.ts resolves DATABASE_URL eagerly —
    # so the variable has to exist even though nothing connects with it.
    env:
      DATABASE_URL: postgresql://playschool:playschool@localhost:5432/playschool
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # `npm ci` runs prisma generate via postinstall, which the typecheck needs.
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # A dependency advisory in a product holding children's records is a
      # deploy blocker, not a backlog item. Runtime dependencies only: a CLI's
      # transitive tree is not reachable from a request.
      - name: No high-severity advisories in runtime dependencies
        run: npm audit --omit=dev --audit-level=high

  # The scoping suite asks a real database real questions — who may read whose
  # medical record — so it needs Postgres and the seed. Running the migrations
  # here also keeps them honest: schema.prisma drifting away from migrations/
  # fails the build rather than the deploy.
  integration:
    name: Scoping against Postgres
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: playschool
          POSTGRES_PASSWORD: playschool
          POSTGRES_DB: playschool
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://playschool:playschool@localhost:5432/playschool
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply migrations
        run: npx prisma migrate deploy
        working-directory: apps/web
      # `migrate deploy` above applied migrations/; this asks whether the
      # database that produced is actually the shape schema.prisma describes.
      # Exit code 2 means drift — the failure mode being a migration that was
      # never written for a schema edit, which only shows up at deploy time.
      - name: Fail if schema.prisma has drifted from migrations/
        run: npx prisma migrate diff --from-config-datasource --to-schema ./src/backend/database/prisma/schema.prisma --exit-code
        working-directory: apps/web
      - run: npm run db:seed --workspace=@climbkiddo/web
      - run: npm run test:integration --workspace=@climbkiddo/web

  # The four paths a school notices within a day: signing in as each role, a
  # family enquiring, a parent paying, a parent opening the camera. Everything
  # else is tested below the browser — this job exists for the failures only a
  # browser sees, like a form that posts and a cookie that never comes back.
  e2e:
    name: Browser journeys
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: playschool
          POSTGRES_PASSWORD: playschool
          POSTGRES_DB: playschool
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://playschool:playschool@localhost:5432/playschool
      # The suite signs in as seeded users; the secrets only need to exist and
      # be stable across the build and the server it starts.
      AUTH_SECRET: ci-only-not-a-real-secret
      CCTV_TOKEN_SECRET: ci-only-not-a-real-secret
      CCTV_INTERNAL_SECRET: ci-only-not-a-real-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply migrations
        run: npx prisma migrate deploy
        working-directory: apps/web
      - run: npm run db:seed --workspace=@climbkiddo/web
      # Chromium only. Three engines would triple the minutes to catch bugs
      # this product has never had.
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npm run e2e --workspace=@climbkiddo/web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
